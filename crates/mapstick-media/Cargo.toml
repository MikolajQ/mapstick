[package]
name = "mapstick-media"
description = "Removable media detection, free space checks and exFAT formatting for MapStick"
version.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
nudl.workspace = true
thiserror = "2.0.11"
tracing = "0.1.40"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", features = ["fs"] }
tokio = { version = "1.36.0", default-features = false, features = ["time"] }
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

[target.'cfg(windows)'.dependencies]
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.36.0", default-features = false, features = ["rt"] }
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3.10"
tokio = { version = "1.36.0", features = ["rt-multi-thread", "macros"] }
tracing-subscriber = "0.3.18"
