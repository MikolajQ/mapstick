[package]
name = "mapstick"
description = "Unofficial navigation firmware downloader for Hyundai, Kia and Genesis vehicles"
version.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.80"
cap-std = "4.0.0"
mapstick-media = { path = "../mapstick-media" }
mapstick-store = { path = "../mapstick-store" }
nudl.workspace = true
reqwest = { version = "0.13.1", features = ["charset", "json", "http2", "rustls-no-provider"], default-features = false }
jiff = "0.2.1"
notify-rust = "4.11.7"
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.140"
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal", "wayland"] }
rustls = { version = "0.23.36", features = ["ring"], default-features = false }
# `~`, nie `^`: unstable-winit-030 (dopasowanie okna do ekranu na Windows)
# Slint może zmienić w dowolnym wydaniu 1.x.
slint = { version = "~1.17.1", features = ["raw-window-handle-06", "unstable-winit-030"] }
sys-locale = "0.3.2"
tokio = { version = "1.36.0", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
# Nazwany potok, którym drugie uruchomienie przekazuje odnośnik oknu (instance.rs).
tokio = { version = "1.36.0", features = ["net", "io-util"] }

[dev-dependencies]
tempfile = "3.10.1"

[build-dependencies]
slint-build = "~1.17.1"
winresource = "0.1.23"
