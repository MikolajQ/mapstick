[package]
name = "mapstick"
description = "Unofficial navigation firmware downloader for Hyundai, Kia and Genesis vehicles"
version.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.80"
cap-std = "4.0.0"
mapstick-media = { path = "../mapstick-media" }
mapstick-store = { path = "../mapstick-store" }
nudl = { path = "../../../nudl" }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
rustls = { version = "0.23.36", features = ["ring"], default-features = false }
slint = "1.17.1"
tokio = { version = "1.36.0", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1.40"
tracing-subscriber = "0.3.18"

[build-dependencies]
slint-build = "1.17.1"
