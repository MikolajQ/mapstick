name: Cross-platform build

# Sprawdza, czy całość kompiluje się i przechodzi testy na Linuksie, Windows
# i macOS. Nie testuje prawdziwego wykrywania czy formatowania nośników —
# runnery nie mają interesujących dysków wymiennych, a formatowanie cudzego
# dysku w CI nie ma sensu i byłoby niebezpieczne, gdyby test trafił nie tam,
# gdzie trzeba. macOS jest tu tylko kompilowany: obsługi nośników tam nie ma.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]
    paths:
      - "crates/**"
      - "packaging/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/cross-platform.yml"

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Nagłówki, których Slint (winit + femtovg) potrzebuje do zbudowania
      # się na Linuksie. Windows i macOS mają to wbudowane w system.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libinput-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Build the whole workspace
        run: cargo build --workspace --locked

      - name: Test the whole workspace
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
